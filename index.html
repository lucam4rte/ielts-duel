<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS Duello</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e5e1d8;--a:#2563eb;--b:#e11d74;--ok:#16a34a;--gold:#f59e0b}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1a1f2b;--ink:#eef1f6;--mute:#9aa3b2;--line:#2a3140;--a:#60a5fa;--b:#f472b6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.pl .n{font-weight:700}.pl .p{font-size:2.2rem;font-weight:800;line-height:1.1}
.pl .s{color:var(--mute);font-size:.85rem}
.p1 .p,.p1 .n{color:var(--a)}.p2 .p,.p2 .n{color:var(--b)}
.lead{outline:2px solid var(--gold);border-radius:12px}
.msg{margin-top:10px;text-align:center;font-weight:600}
.test{border-top:1px solid var(--line);padding:12px 0}.test:first-of-type{border-top:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;border-radius:6px;padding:1px 7px;color:#fff}
.tag.reading{background:#0d9488}.tag.listening{background:#7c3aed}
.test a{color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.who{display:flex;align-items:center;gap:6px;font-size:.9rem}
input[type=number]{width:70px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem;width:140px}
textarea{width:100%;height:80px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:12px monospace;padding:6px}
button,select{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;cursor:pointer}
button.who-btn{font-weight:700}button.on0{background:var(--a);color:#fff;border-color:var(--a)}button.on1{background:var(--b);color:#fff;border-color:var(--b)}
button.swap{padding:1px 8px;margin-left:6px;font-size:.85rem}
button.pri{background:var(--a);color:#fff;border-color:var(--a)}
.band{color:var(--mute);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.w1{color:var(--a);font-weight:700}.w2{color:var(--b);font-weight:700}
.hint{color:var(--mute);font-size:.82rem}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<h1>🏆 IELTS Duello</h1>
<p class="sub"><span id="today"></span> · <span id="sync"></span></p>

<div class="card" id="board"></div>

<div class="card">
  <h2>Today's tests</h2>
  <div class="row" style="margin:0 0 6px"><span class="who">Who are you?</span>
    <button id="b0" class="who-btn"></button><button id="b1" class="who-btn"></button></div>
  <div class="hint">Enter the IELTS band you get at the end of each test (0 to 9, half bands allowed).</div>
  <div id="tests"></div>
</div>

<div class="card">
  <h2>Daily history</h2>
  <div id="hist"></div>
</div>

<div class="card"><p class="hint" style="margin:0">Points: each test is worth band × 10. Bonus +10 for completing all of the day's tests, plus +2 for each extra consecutive day of streak (max +10).</p></div>
</main>

    S.entries = e; swapNote='';
    try{
      const r2 = await fetch(BASE+'/rest/v1/swaps?select=day,idx,reroll',{headers:H});
      if(r2.ok){ const sw={}; (await r2.json()).forEach(x=>sw[x.day+'|'+x.idx]=x.reroll); S.swaps=sw; }
      else swapNote=' (swap table missing: run supabase-swaps.sql)';
    }catch(_){ swapNote=' (swaps not synced)' }
    save(); setSync(true);
    if(!document.activeElement || document.activeElement.tagName!=='INPUT') render();
  }catch(e){ if(!lastErr) lastErr=String(e); setSync(false) }
}
async function remoteSwap(day,i,reroll){
  if(!REMOTE) return;
  try{
    const r = await fetch(BASE+'/rest/v1/swaps?on_conflict=day,idx',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{day,idx:i,reroll}])});
    if(!r.ok){ lastErr='swaps '+r.status; setSync(false); return; }
    await fetch(BASE+`/rest/v1/scores?day=eq.${day}&idx=eq.${i}`,{method:'DELETE',headers:H});
    setSync(true);
  }catch(e){ setSync(false) }
}
async function remoteSet(day,i,p,band){
  if(!REMOTE) return;
  try{
    const q = `day=eq.${day}&idx=eq.${i}&player=eq.${p}`;
    const r = band===null
      ? await fetch(BASE+'/rest/v1/scores?'+q,{method:'DELETE',headers:H})
      : await fetch(BASE+'/rest/v1/scores?on_conflict=day,idx,player',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{day,idx:i,player:p,band}])});
    setSync(r.ok);
  }catch(_){ setSync(false) }
}
function setSync(ok){ const el=document.getElementById('sync'); if(ok) lastErr=''; if(el) el.textContent = ok?'🟢 synced'+swapNote:'🔴 offline: will retry'+(lastErr?' ('+lastErr+')':''); }

/* ---------- stato ---------- */
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) } catch(e){}
S = S || {me:0, entries:{}};
S.names = ['Luca','Vicky'];
S.swaps = S.swaps || {};
const save = () => { try{localStorage.setItem(KEY, JSON.stringify(S))}catch(e){} };

/* ---------- date e sorteggio deterministico ---------- */
const fmt = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayNum = s => Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5);
const addDays = (s,n) => { const t=new Date((dayNum(s)+n)*864e5); return t.toISOString().slice(0,10) };
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,seed){a=a.slice();const r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const R = shuffle(TESTS.reading, 1234), L = shuffle(TESTS.listening, 5678);
const cache = {};
function baseTests(date){
  if(cache[date]) return cache[date];
  let rp=0, lp=0, last=[];
  const n = Math.max(0, dayNum(date)-dayNum(START));
  for(let i=0;i<=n;i++){
    const d = addDays(START,i);
    const cnt = rng(dayNum(d)*7919)() < 0.5 ? 2 : 3;      // 2 o 3 test al giorno
    const nr = cnt-1, nl = 1;                               // sempre almeno 1 listening
    last=[];
    for(let k=0;k<nr;k++) last.push({type:'reading', t:R[rp++%R.length]});
    for(let k=0;k<nl;k++) last.push({type:'listening', t:L[lp++%L.length]});
    if(d===date) break;
  }
  return cache[date]=last;
}

// Rerolled slots: replace a broken test with another random one (same result for everyone, via the shared 'swaps' table)
function testsFor(date){
  const base=baseTests(date), used=new Set(base.map(x=>x.t[1]));
  return base.map((x,i)=>{
    const r=S.swaps[date+'|'+i]||0; let cur=x;
    for(let k=1;k<=r;k++){
      const pool=TESTS[x.type].filter(t=>!used.has(t[1])); if(!pool.length) break;
      const t=pool[Math.floor(rng(dayNum(date)*131+i*17+k)()*pool.length)];
      used.add(t[1]); cur={type:x.type,t};
    }
    return cur;
  });
}

/* ---------- punteggi ---------- */
const band = (type,n) => n;
const ek = (date,i,p) => date+'|'+i+'|'+p;
const getE = (date,i,p) => S.entries[ek(date,i,p)];
function dayStats(date,p){
  const ts = testsFor(date); let done=0, pts=0;
  ts.forEach((x,i)=>{const e=getE(date,i,p); if(e){done++; pts+=Math.round(band(x.type,e.s)*10)}});
  return {done, total:ts.length, pts, full: done===ts.length};
}
function totals(p){
  const today = fmt(new Date()); let total=0, streak=0, tests=0, best=0;
  const days=[]; for(let d=START; d<=today; d=addDays(d,1)) days.push(d);
  days.forEach(d=>{
    const s=dayStats(d,p); tests+=s.done; let pts=s.pts;
    if(s.full){streak++; pts+=10+Math.min(streak-1,5)*2} else if(d!==today) streak=0;
    total+=pts; best=Math.max(best,streak); s.bonusPts=pts; s.streak=streak;
  });
  // current streak: if today is incomplete, it counts up to yesterday
  return {total,streak,tests,days};
}
const dayPts = (d,p) => { const s=dayStats(d,p); return s; };

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
function render(){
  const today = fmt(new Date());
  $('today').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const names=S.names, T=[totals(0),totals(1)];
  const lead = T[0].total===T[1].total ? -1 : (T[0].total>T[1].total?0:1);
  const gap = Math.abs(T[0].total-T[1].total);
  $('board').innerHTML = `<div class="vs">
    ${[0,1].map(p=>`<div class="pl p${p+1} ${lead===p?'lead':''}"><div class="n">${lead===p?'👑 ':''}${esc(names[p])}</div><div class="p">${T[p].total}</div><div class="s">${T[p].tests} ${T[p].tests===1?'test':'tests'} · 🔥 streak ${T[p].streak}</div></div>`).join('<div style="font-weight:800;color:var(--mute)">VS</div>')}
  </div><div class="msg">${lead<0? (T[0].total?'Perfect tie! 🤝':'Game on: who scores first?') : `${esc(names[lead])} leads by ${gap} points${gap<30?' — still anyone\'s game! 😏':' 💪'}`}</div>${todayMsg(today)}`;

  const ts = testsFor(today);
  $('tests').innerHTML = ts.map((x,i)=>{
    const o = 1-S.me, mine=getE(today,i,S.me), oth=getE(today,i,o);
    return `<div class="test"><span class="tag ${x.type}">${x.type}</span> <a href="${x.t[1]}" target="_blank" rel="noopener">${esc(x.t[0])}</a><button class="swap" data-i="${i}" title="Link broken? Swap with another random test">🔄 Swap</button>
      <div class="row">
        <span class="who">${esc(names[S.me])}: <input type="number" min="0" max="9" step="0.5" inputmode="decimal" data-i="${i}" value="${mine?mine.s:''}" placeholder="band">
          <span class="band">${mine?`${Math.round(mine.s*10)} pts`:''}</span></span>
        <span class="who">${esc(names[o])}: ${oth?`<b>band ${oth.s}</b> <span class="band">${Math.round(oth.s*10)} pts</span>`:'<span class="band">—</span>'}</span>
      </div></div>`}).join('');
  document.querySelectorAll('#tests input').forEach(inp=>inp.onchange=()=>{
    const i=+inp.dataset.i, v=inp.value.trim(), k=ek(today,i,S.me);
    if(v===''){ delete S.entries[k]; S.entries['del|'+k]={ts:Date.now()}; }
    else { const n=Math.max(0,Math.min(9,Math.round(+v.replace(',','.')*2)/2)); S.entries[k]={s:n,ts:Date.now()}; delete S.entries['del|'+k]; }
    save(); render();
    remoteSet(today,i,S.me, v===''?null:S.entries[k].s);
  });

  document.querySelectorAll('#tests .swap').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, had=[0,1].some(p=>getE(today,i,p));
    if(had && !confirm('Scores already entered for this test will be deleted for both players. Swap anyway?')) return;
    const k=today+'|'+i; S.swaps[k]=(S.swaps[k]||0)+1;
    [0,1].forEach(p=>delete S.entries[ek(today,i,p)]);
    save(); render(); remoteSwap(today,i,S.swaps[k]);
  });
  const dp=[0,1].map(p=>dailyPoints(p));
  $('hist').innerHTML = `<table><tr><th>Day</th><th>${esc(names[0])}</th><th>${esc(names[1])}</th><th>Winner</th></tr>`+
    T[0].days.slice().reverse().slice(0,30).map(d=>{
      const a=dp[0][d], b=dp[1][d];
      let w='—'; if(d===today && (a.done<a.total||b.done<b.total) && a.pts===b.pts) w='in progress';
      else if(a.pts>b.pts) w=`<span class="w1">${esc(names[0])}</span>`; else if(b.pts>a.pts) w=`<span class="w2">${esc(names[1])}</span>`; else if(a.done||b.done) w='tie';
      const cell=x=>`${x.pts} pts <span class="hint">(${x.done}/${x.total}${x.full?' ✅':''})</span>`;
      return `<tr><td>${d.slice(5).split('-').reverse().join('/')}</td><td>${cell(a)}</td><td>${cell(b)}</td><td>${w}</td></tr>`}).join('')+'</table>';
}
function dailyPoints(p){
  const out={}, today=fmt(new Date()); let streak=0;
  for(let d=START; d<=today; d=addDays(d,1)){
    const s=dayStats(d,p); let pts=s.pts;
    if(s.full){streak++; pts+=10+Math.min(streak-1,5)*2} else if(d!==today) streak=0;
    out[d]={pts,done:s.done,total:s.total,full:s.full};
  }
  return out;
}
function todayMsg(today){
  const a=dayStats(today,0), b=dayStats(today,1), n=S.names;
  if(a.done===b.done) return a.done? `<div class="hint" style="text-align:center">Today both are at ${a.done}/${a.total} tests.</div>` : `<div class="hint" style="text-align:center">Nobody has done any tests yet today. ⏳</div>`;
  const [w,l,ws,ls]=a.done>b.done?[0,1,a,b]:[1,0,b,a];
  return `<div class="hint" style="text-align:center">Today ${esc(n[w])} has done ${ws.done}/${ws.total} tests, ${esc(n[l])} ${ls.done===0?'none 😴':ls.done+'/'+ls.total}.</div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- chi sono ---------- */
function setupUI(){
  [0,1].forEach(i=>{const b=$('b'+i); b.textContent=S.names[i]; b.className='who-btn'+(S.me===i?' on'+i:''); b.onclick=()=>{S.me=i;save();setupUI();render()}});
}
setupUI(); render(); remoteLoad();
setInterval(remoteLoad,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)remoteLoad()});
</script>
</body>
